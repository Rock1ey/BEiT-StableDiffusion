dataset_params:
  im_path: 'data/hemit'
  im_channels: 3
  im_size: 256
  name: 'hemit'
  patch_mode: 'grid'               # 1024x1024 -> 4x4=16 fixed patches of 256x256

diffusion_params:
  num_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012

ldm_params:
  down_channels: [ 256, 384, 512, 768 ]
  mid_channels: [ 768, 512 ]
  down_sample: [ True, True, True ]
  attn_down: [ True, True, True ]
  time_emb_dim: 512
  norm_channels: 32
  num_heads: 16
  conv_out_channels: 128
  num_down_layers: 2
  num_mid_layers: 2
  num_up_layers: 2
  condition_config:
    condition_types: [ 'source_concat', 'encoder' ]   # source-concat (latent channel-cat) + DINOv2 cross-attn; no image-cond
    encoder_condition_config:
      encoder_embed_dim: 768              # DINOv2 ViT-B/14 output dim
      encoder_model_name: 'dinov2'
      cond_drop_prob: 0.05

autoencoder_params:
  z_channels: 4
  codebook_size: 2048
  down_channels: [ 64, 128, 256, 256 ]
  mid_channels: [ 256, 256 ]
  down_sample: [ True, True, True ]
  attn_down: [ False, False, False ]
  norm_channels: 32
  num_heads: 4
  num_down_layers: 2
  num_mid_layers: 2
  num_up_layers: 2

train_params:
  seed: 1111
  task_name: 'hemit_dino_sc'
  shared_artifact_root: 'hemit_shared_artifacts'
  ldm_batch_size: 64
  ldm_micro_batch_size: 0
  autoencoder_batch_size: 8
  disc_start: 5000
  disc_weight: 0.5
  codebook_weight: 1
  commitment_beta: 0.2
  perceptual_weight: 1
  kl_weight: 0.000005
  ldm_epochs: 200
  autoencoder_epochs: 20
  num_samples: 8
  num_grid_rows: 4
  ldm_lr: 0.00005
  ldm_lr_min: 0
  autoencoder_lr: 0.00005
  autoencoder_acc_steps: 4
  autoencoder_img_save_steps: 64
  save_latents: True
  cf_guidance_scale: 1.5
  lambda_l1: 0.5
  lambda_lpips: 0.0
  lpips_every: 4
  num_workers: 12
  vae_latent_dir_name: 'vae_latents'
  vqvae_latent_dir_name: 'vqvae_latents'
  ldm_ckpt_name: 'ddpm_ckpt_hemit_dino_sc.pth'
  vqvae_autoencoder_ckpt_name: 'vqvae_autoencoder_ckpt.pth'
  vae_autoencoder_ckpt_name: 'vae_autoencoder_ckpt.pth'
  vqvae_discriminator_ckpt_name: 'vqvae_discriminator_ckpt.pth'
  vae_discriminator_ckpt_name: 'vae_discriminator_ckpt.pth'
  lr_scheduler: 'cosine'
  ema_decay: 0.9999
  grad_clip: 1.0
  use_amp: True
  use_torch_compile: True
